schema_version: 1

context:
  name: aws-c-cal
  version: "1.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/awslabs/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: 9c6d424d206dd7822aa44fa39ce31575dcbaa83133620abdac8e56e4cea9667c

build:
  number: 1

requirements:
  build:
    - cmake
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ninja
  host:
    - aws-c-common
    - if: not win and not osx
      then: openssl
  run_exports:
    - ${{ pin_subpackage("aws-c-cal", upper_bound="x.x") }}

tests:
  - files:
      recipe:
        - cmake_test/
    requirements:
      run:
        - ${{ compiler('c') }}
        - cmake
        - ninja
        - pkg-config
    script:
      - if: unix
        then:
          - test -f $PREFIX/lib/libaws-c-cal${SHLIB_EXT}
          - test -f $PREFIX/include/aws/cal/cal.h
      - if: win
        then:
          - if not exist %LIBRARY_INC%\\aws\\cal\\cal.h exit 1
          - if not exist %PREFIX%\\Library\\bin\\aws-c-cal.dll exit 1
      - cd cmake_test
      - if: unix
        then: cmake -GNinja $CMAKE_ARGS .
      - if: win
        then: cmake -GNinja %CMAKE_ARGS% .

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: "Aws Crypto Abstraction Layer: Cross-Platform, C99 wrapper for cryptography primitives."
  homepage: https://github.com/awslabs/aws-c-cal
  repository: https://github.com/awslabs/aws-c-cal

extra:
  recipe-maintainers:
    - xhochy
    - conda-forge/aws-sdk-cpp
